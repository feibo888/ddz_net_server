syntax = "proto3";

enum RequestCode
{
    UserLogin = 0;
    Register = 1;
    AesFenFa = 2;
    AutoRoom = 3;
    ManualRoom = 4;
    SearchRoom = 5;
    GrabLord = 6;
    PlayAHand = 7;
    GameOver = 8;
    Continue = 9;
    LeaveRoom = 10;
    GoodBye = 11;
    ReDealCards = 12;
    Heartbeat = 13;
    LordDetermined = 14;
}

enum ResponseCode
{
    LoginOk = 0;
    RegisterOk = 1;
    RsaFenFa = 2;
    AesVerifyOk = 3;
    JoinRoomOK = 4;
    StartGame = 5;
    SearchRoomOK = 6;
    DealCards = 7;
    OtherGrabLord = 8;
    OtherPlayHand = 9;
    OtherLeaveRoom = 10;
    HeartbeatReply = 11;
    NetworkDealCards = 12;       // 网络版发牌（只包含玩家自己的牌）
    GameEndCards = 13;          // 游戏结束时的剩余手牌信息
    PlayerCardCount = 14;     // 其他玩家手牌数量信息
    LordCards = 15;
    ScoreUpdate = 16;         // 新增：分数更新消息
    Failed = 17;
}

message Information
{
    string username = 1;
    string roomname = 2;
    string data1 = 3;
    string data2 = 4;
    string data3 = 5;
    RequestCode reqCode = 6;
    ResponseCode resCode = 7;
}
