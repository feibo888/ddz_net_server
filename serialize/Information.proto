syntax = "proto3";

enum RequestCode
{
    UserLogin = 0;
    Register = 1;
    AesFenFa = 2;
    AutoRoom = 3;
    ManualRoom = 4;
    SearchRoom = 5;
    GrabLord = 6;
    PlayAHand = 7;
    GameOver = 8;
    Continue = 9;
    LeaveRoom = 10;
    GoodBye = 11;
    ReDealCards = 12;
    Heartbeat = 13;
    LordDetermined = 14;
    ReconnectRequest = 15;     // 重连请求
}

enum ResponseCode
{
    LoginOk = 0;
    RegisterOk = 1;
    RsaFenFa = 2;
    AesVerifyOk = 3;
    JoinRoomOK = 4;
    StartGame = 5;
    SearchRoomOK = 6;
    DealCards = 7;
    OtherGrabLord = 8;
    OtherPlayHand = 9;
    OtherLeaveRoom = 10;
    HeartbeatReply = 11;
    NetworkDealCards = 12;       // 网络版发牌（只包含玩家自己的牌）
    GameEndCards = 13;          // 游戏结束时的剩余手牌信息
    PlayerCardCount = 14;     // 其他玩家手牌数量信息
    LordCards = 15;
    ScoreUpdate = 16;         // 新增：分数更新消息
    PlayHandSuccess = 17;
    ReconnectSyncStart = 18;  // 新增：重连同步开始
    ReconnectSyncEnd = 19;    // 新增：重连同步结束
    GameStateSync = 20;       // 新增：游戏状态同步
    PlayerHandSync = 21;      // 新增：玩家手牌同步
    Failed = 22;
    ReconnectSuccess = 23;     // 重连成功
    ReconnectFailed = 24;      // 重连失败
    GameEnded = 25;           // 游戏已结束
}

message Information
{
    string username = 1;
    string roomname = 2;
    string data1 = 3;
    string data2 = 4;
    string data3 = 5;
    string data4 = 6;
    RequestCode reqCode = 7;
    ResponseCode resCode = 8;
}
